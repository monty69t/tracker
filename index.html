<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse 1one — контроль времени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== RESET & BASE ===== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  :root {
    --bg: #F8F7FA;
    --surface: #FFFFFF;
    --ink: #1A1625;
    --muted: #78738A;
    --border: #EDEBF2;
    --study: #6C5CE7;
    --study-l: #F0EDFF;
    --work: #F39C12;
    --work-l: #FFF8EE;
    --training: #00B894;
    --training-l: #E6F9F3;
    --personal: #E17055;
    --personal-l: #FDF0ED;
    --pulse: #6C5CE7;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(26,22,37,0.06), 0 4px 12px rgba(26,22,37,0.04);
    --shadow-hover: 0 4px 16px rgba(26,22,37,0.08);
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    min-height: 100vh;
  }

  #app {
    max-width: 1024px;
    margin: 0 auto;
    padding: 24px 24px 60px;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes ribbonGrow {
    from {
      opacity: 0;
      transform: scaleX(0.85);
    }
    to {
      opacity: 1;
      transform: scaleX(1);
    }
  }

  /* ===== LOGO ===== */
  .logo {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    position: relative;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 40px;
    height: 40px;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .logo-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .logo-name span {
    color: var(--pulse);
  }

  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ===== UTILITY ===== */
  .flex {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .flex-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  /* ===== TOPBAR ===== */
  .topbar {
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  /* ===== VIEW TOGGLE ===== */
  .viewtoggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
  }

  .viewtoggle button {
    border: none;
    background: transparent;
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: 0.2s;
  }

  .viewtoggle button.active {
    background: var(--pulse);
    color: #fff;
    box-shadow: 0 2px 8px rgba(108, 92, 231, 0.25);
  }

  .viewtoggle button:not(.active):hover {
    color: var(--ink);
    background: var(--bg);
  }

  /* ===== CODE BAR ===== */
  .code-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 18px;
  }

  .code-bar .lbl {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .code-pill {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    background: var(--bg);
    color: var(--ink);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
  }

  .code-bar button {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }

  .code-bar button:hover {
    border-color: var(--pulse);
    color: var(--pulse);
  }

  .code-bar .spacer {
    flex: 1;
  }

  .code-bar .status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .code-bar .status.online {
    background: #00B894;
  }

  .code-bar .status.offline {
    background: #E17055;
  }

  /* ===== NAV ===== */
  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }

  .nav button {
    border: 1px solid var(--border);
    background: var(--surface);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    color: var(--ink);
    transition: 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav button:hover {
    background: var(--bg);
    border-color: var(--pulse);
  }

  .nav .label {
    font-weight: 600;
    font-size: 14px;
    min-width: 180px;
    text-align: center;
    font-family: 'Inter', sans-serif;
  }

  .nav .today {
    border-radius: 8px;
    padding: 0 16px;
    width: auto;
    height: 32px;
    font-size: 12px;
    font-weight: 500;
    background: var(--surface);
  }

  /* ===== FOCUS ===== */
  button:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--pulse);
    outline-offset: 2px;
  }

  /* ===== DAY SCHEDULE ===== */
  .day-schedule {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  .day-schedule-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .day-schedule-header h3 {
    font-size: 15px;
    font-weight: 600;
  }

  .day-schedule-header .date {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  .schedule-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-size: 13px;
  }

  .schedule-grid .time {
    color: var(--muted);
    font-weight: 500;
    padding: 4px 0;
  }

  .schedule-grid .task {
    color: var(--ink);
    padding: 4px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .schedule-grid .task .dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .schedule-grid .task.done {
    opacity: 0.5;
    text-decoration: line-through;
  }

  .schedule-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 0;
  }

  /* ===== BALANCE ===== */
  .balance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }

  .balance-card .btitle {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .ribbon {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: #F0EEF5;
    transform-origin: left;
    animation: ribbonGrow 0.5s ease both;
  }

  .ribbon > span {
    height: 100%;
    transition: width 0.4s ease;
  }

  .ribbon.empty {
    background: #F0EEF5;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 12px;
  }

  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .legend .dot {
    width: 8px;
    height: 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend .pct {
    font-weight: 600;
    color: var(--ink);
  }

  .empty-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* ===== CALENDAR WEEK ===== */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .week-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 150px;
    font-family: inherit;
    text-align: left;
    transition: 0.2s;
    box-shadow: var(--shadow);
  }

  .week-col:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: #D5D0E0;
  }

  .week-col.today {
    border-color: var(--pulse);
  }

  .week-col.selected {
    background: var(--ink);
    border-color: transparent;
  }

  .week-col.selected .wd-name,
  .week-col.selected .wd-num,
  .week-col.selected .chip {
    color: #fff;
  }

  .wd-name {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }

  .wd-num {
    font-size: 18px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
  }

  .week-col .mini-ribbon {
    margin-top: 0;
  }

  .chip-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .chip {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 5px;
    line-height: 1.4;
    font-weight: 400;
  }

  .week-col.selected .chip {
    background: rgba(255, 255, 255, 0.12);
  }

  .chip .sq {
    width: 5px;
    height: 5px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .chip.done {
    opacity: 0.4;
    text-decoration: line-through;
  }

  .chip-more {
    font-size: 10px;
    color: var(--muted);
  }

  .week-col.selected .chip-more {
    color: rgba(255, 255, 255, 0.6);
  }

  .chip-template {
    background: rgba(108, 92, 231, 0.08);
    border: 1px dashed var(--pulse);
  }

  .week-col.selected .chip-template {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .chip-template-icon {
    font-size: 9px;
  }

  /* ===== CALENDAR MONTH ===== */
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }

  .weekday-row div {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 20px;
  }

  .daycell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 8px;
    min-height: 64px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: 0.2s;
    box-shadow: var(--shadow);
  }

  .daycell:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  .daycell.other {
    opacity: 0.3;
  }

  .daycell.today {
    border-color: var(--pulse);
  }

  .daycell.selected {
    background: var(--ink);
    border-color: transparent;
  }

  .daycell.selected .daynum,
  .daycell.selected .count {
    color: #fff;
  }

  .daynum {
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
  }

  .count {
    font-size: 10px;
    color: var(--muted);
  }

  .mini-ribbon {
    display: flex;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    background: #F0EEF5;
    margin-top: auto;
  }

  .mini-ribbon > span {
    height: 100%;
  }

  /* ===== TASK PANEL ===== */
  .task-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .task-panel h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 14px;
  }

  .task-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }

  .task-row:last-of-type {
    border-bottom: none;
  }

  .task-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--pulse);
    flex-shrink: 0;
    cursor: pointer;
  }

  .task-cat {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .task-title {
    flex: 1;
    font-size: 13px;
    font-weight: 400;
  }

  .task-title.done {
    text-decoration: line-through;
    color: var(--muted);
  }

  .task-time {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-weight: 500;
  }

  .task-cat-label {
    font-size: 14px;
  }

  .del-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    transition: 0.15s;
  }

  .del-btn:hover {
    color: #E17055;
    background: var(--personal-l);
  }

  .empty-day {
    color: var(--muted);
    font-size: 13px;
    padding: 6px 0 14px;
  }

  .template-badge {
    font-size: 9px;
    background: var(--pulse);
    color: #fff;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-weight: 500;
  }

  /* ===== ADD FORM ===== */
  .add-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    align-items: center;
  }

  .add-form input[type="text"] {
    flex: 1 1 180px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    transition: 0.15s;
  }

  .add-form input[type="text"]:focus {
    border-color: var(--pulse);
    background: var(--surface);
  }

  .add-form select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
  }

  .add-form .time-field {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .add-form .time-field label {
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
  }

  .add-form input[type="time"] {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    background: var(--bg);
  }

  .add-form input[type="time"]:focus {
    border-color: var(--pulse);
    background: var(--surface);
  }

  .add-form button {
    background: var(--pulse);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: 0.2s;
    box-shadow: 0 2px 8px rgba(108, 92, 231, 0.25);
  }

  .add-form button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(108, 92, 231, 0.35);
  }

  .add-form button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .hint {
    font-size: 11px;
    color: var(--muted);
    width: 100%;
    margin-top: 0;
  }

  /* ===== TEMPLATES ===== */
  .templates-section {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .templates-section h3 {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 10px;
  }

  .template-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--bg);
    border-radius: 6px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    font-size: 12px;
  }

  .template-item .days {
    font-size: 11px;
    color: var(--muted);
  }

  .template-item .del-tpl {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
    transition: 0.15s;
  }

  .template-item .del-tpl:hover {
    color: #E17055;
  }

  .add-template-btn {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 8px;
    width: 100%;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    transition: 0.15s;
  }

  .add-template-btn:hover {
    border-color: var(--pulse);
    color: var(--pulse);
  }

  /* ===== MODALS ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 22, 37, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .overlay[hidden] {
    display: none;
  }

  .modal {
    background: var(--surface);
    border-radius: 12px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(26, 22, 37, 0.2);
    animation: fadeInUp 0.2s ease both;
  }

  .modal h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .modal p {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 14px;
    line-height: 1.5;
  }

  .modal input,
  .modal select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    margin-bottom: 10px;
  }

  .modal input:focus,
  .modal select:focus {
    border-color: var(--pulse);
    background: var(--surface);
  }

  .modal .row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .modal button {
    flex: 1;
    padding: 9px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .modal .go {
    background: var(--pulse);
    color: #fff;
    box-shadow: 0 2px 8px rgba(108, 92, 231, 0.2);
  }

  .modal .cancel {
    background: var(--bg);
    color: var(--ink);
  }

  .weekday-checkboxes {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin: 6px 0 10px;
  }

  .weekday-checkboxes label {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 12px;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    transition: 0.15s;
  }

  .weekday-checkboxes label.active {
    background: var(--study-l);
    border-color: var(--pulse);
  }

  .weekday-checkboxes input[type="checkbox"] {
    accent-color: var(--pulse);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(26, 22, 37, 0.25);
    opacity: 0;
    transform: translateY(8px);
    transition: 0.25s;
    pointer-events: none;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 80vw;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);

  .toast.err {

  /* ===== MISC ===== */
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;

  }

  .setup-banner {
    background: #FFF8EE;
    border: 1px solid #F0D8A8;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 12px;
    line-height: 1.6;
    color: #7A6A3A;
  }

  .setup-banner code {
    background: #F5EED6;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 680px) {
    #app {
      padding: 16px 14px 40px;
    }

    .week-grid {
      grid-template-columns: 1fr 1fr;
    }

    .week-col {
      min-height: auto;
    }

    .month-grid {
      gap: 4px;
    }

      min-height: 48px;
      padding: 6px 4px;

    .viewtoggle button {

  @media (max-width: 420px) {
    .week-grid {
      grid-template-columns: 1fr;
    }

</style>

<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="code-overlay" hidden>
  <div class="modal">
    <h3>Войти по коду</h3>

      <button class="cancel" id="code-cancel">Отмена</button>

</div>

<div class="overlay" id="template-overlay" hidden>
  <div class="modal">
    <h3>➕ Регулярная задача</h3>
    <p>Будет автоматически добавляться на выбранные дни каждую неделю.</p>
    <input type="text" id="tpl-title" placeholder="Название задачи" style="text-transform:none;letter-spacing:normal;">
    <select id="tpl-cat">
      <option value="study">📚 Учёба</option>
      <option value="work">💼 Работа</option>
      <option value="training">🏋️ Тренировки</option>
      <option value="personal">🌿 Личное</option>
    </select>
    <div style="display:flex;gap:8px;">
      <div class="time-field" style="flex:1;"><label for="tpl-start" style="font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;display:block;margin-bottom:2px;">Начало</label><input type="time" id="tpl-start" style="width:100%;"></div>
      <div class="time-field" style="flex:1;"><label for="tpl-end" style="font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;display:block;margin-bottom:2px;">Конец</label><input type="time" id="tpl-end" style="width:100%;"></div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;">Дни недели:</div>

      <label><input type="checkbox" value="1"> Пн</label>
      <label><input type="checkbox" value="2"> Вт</label>
      <label><input type="checkbox" value="3"> Ср</label>
      <label><input type="checkbox" value="4"> Чт</label>
      <label><input type="checkbox" value="5"> Пт</label>
      <label><input type="checkbox" value="6"> Сб</label>
      <label><input type="checkbox" value="0"> Вс</label>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="cancel" id="tpl-cancel">Отмена</button>
      <button class="go" id="tpl-save">Сохранить</button>
    </div>
  </div>
</div>

<script>
/* ====== НАСТРОЙКИ БЭКЕНДА (Supabase) ====== */
const SUPABASE_URL = 'https://rrweviidvjbhwazaowff.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_TcPfcOeyHwanGaKhWQQzKg_q42aU83h';
const TABLE = 'tasks';
const TEMPLATES_TABLE = 'templates';
/* ============================================ */

const CATEGORIES = {
  study:    { label:'Учёба',          hex:'#6C5CE7', emoji:'📚' },
  work:     { label:'Работа',         hex:'#F39C12', emoji:'💼' },
  training: { label:'Тренировки',     hex:'#00B894', emoji:'🏋️' },
  personal: { label:'Личное',         hex:'#E17055', emoji:'🌿' },
};
const CAT_ORDER = ['study','work','training','personal'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WEEKDAYS_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function pad(n){return n<10?'0'+n:''+n;}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function sameDay(a,b){return toKey(a)===toKey(b);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function startOfWeek(d){const dow=(d.getDay()+6)%7;return addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-dow);}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}

const CODE_KEY = 'pulse_code';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function generateCode(){
  let s='';
  for(let i=0;i<6;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
function getUserCode(){
  let code = localStorage.getItem(CODE_KEY);
  if(!code){ code = generateCode(); localStorage.setItem(CODE_KEY, code); }
  return code;
}
function setUserCode(code){ localStorage.setItem(CODE_KEY, code); }

function isConfigured(){
  return !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON-KEY');
}

async function sbFetch(path, options={}){
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
  }, options.headers||{});
  return fetch(SUPABASE_URL + path, Object.assign({}, options, {headers}));
}

let state = {
  view: 'week',
  anchor: new Date(),
  selected: new Date(),
  events: [],
  templates: [],
  code: getUserCode(),
  online: isConfigured(),
};

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

async function fetchEvents(){
  if(!state.online) return [];
  try{
    const res = await sbFetch(`/rest/v1/${TABLE}?user_code=eq.${encodeURIComponent(state.code)}&select=*&order=date.asc,start_time.asc`);
    if(!res.ok) throw new Error('bad status '+res.status);
    const rows = await res.json();
    return rows.map(r=>({ id:r.id, date:r.date, start:r.start_time, end:r.end_time, title:r.title, category:r.category, done:r.done, is_template:r.is_template||false }));
  }catch(e){
    showToast('Не удалось загрузить данные с сервера', true);
    return [];
  }
}

async function fetchTemplates(){
  if(!state.online) return [];
  try{
    const res = await sbFetch(`/rest/v1/${TEMPLATES_TABLE}?user_code=eq.${encodeURIComponent(state.code)}&select=*`);
    if(!res.ok) throw new Error('bad status '+res.status);
    const rows = await res.json();
    return rows.map(r=>({ id:r.id, title:r.title, category:r.category, start:r.start_time, end:r.end_time, days:r.days }));
  }catch(e){
    return [];
  }
}

async function insertEvent(ev){
  try{
    const res = await sbFetch(`/rest/v1/${TABLE}`, {
      method:'POST',
      headers:{ 'Prefer':'return=representation' },
      body: JSON.stringify([{
        user_code: state.code, date: ev.date, start_time: ev.start, end_time: ev.end,
        title: ev.title, category: ev.category, done: false, is_template: ev.is_template||false
      }])
    });
    if(!res.ok) throw new Error('insert failed');
    const rows = await res.json();
    showToast('Сохранено ✓');
    return rows[0];
  }catch(e){
    showToast('Не удалось сохранить дело', true);
    return null;
  }
}

async function patchEvent(id, patch){
  try{
    const res = await sbFetch(`/rest/v1/${TABLE}?id=eq.${id}`, { method:'PATCH', body: JSON.stringify(patch) });
    if(!res.ok) throw new Error('patch failed');
    showToast('Сохранено ✓');
  }catch(e){
    showToast('Не удалось обновить дело', true);
  }
}

async function deleteEventRemote(id){
  try{
    const res = await sbFetch(`/rest/v1/${TABLE}?id=eq.${id}`, { method:'DELETE' });
    if(!res.ok) throw new Error('delete failed');
    showToast('Удалено');
  }catch(e){
    showToast('Не удалось удалить дело', true);
  }
}

async function insertTemplate(tpl){
  try{
    const res = await sbFetch(`/rest/v1/${TEMPLATES_TABLE}`, {
      method:'POST',
      headers:{ 'Prefer':'return=representation' },
      body: JSON.stringify([{
        user_code: state.code, title: tpl.title, category: tpl.category,
        start_time: tpl.start, end_time: tpl.end, days: tpl.days
      }])
    });
    if(!res.ok) throw new Error('insert template failed');
    const rows = await res.json();
    showToast('Шаблон сохранён ✓');
    return rows[0];
  }catch(e){
    showToast('Не удалось сохранить шаблон', true);
    return null;
  }
}

async function deleteTemplateRemote(id){
  try{
    const res = await sbFetch(`/rest/v1/${TEMPLATES_TABLE}?id=eq.${id}`, { method:'DELETE' });
    if(!res.ok) throw new Error('delete template failed');
  }catch(e){
    showToast('Не удалось удалить шаблон', true);
  }
}

function eventsOn(dateKey){ return state.events.filter(e=>e.date===dateKey); }
function eventsInRange(start,end){
  const sk=toKey(start), ek=toKey(end);
  return state.events.filter(e=> e.date>=sk && e.date<=ek);
}
function sortByStart(evs){ return evs.slice().sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99')); }
function timeLabel(e){ return e.end ? `${e.start}–${e.end}` : e.start; }

function ribbonSegments(evs){
  const counts = {study:0,work:0,training:0,personal:0};
  evs.forEach(e=>{ if(counts[e.category]!==undefined) counts[e.category]++; });
  return {counts, total: evs.length};
}
function renderRibbonHTML(counts,total,height){
  if(total===0) return `<div class="ribbon empty" style="height:${height}px"></div>`;
  let html = `<div class="ribbon" style="height:${height}px">`;
  CAT_ORDER.forEach(k=>{
    if(counts[k]>0){
      const pct = (counts[k]/total*100).toFixed(2);
      html += `<span style="width:${pct}%;background:${CATEGORIES[k].hex}"></span>`;
    }
  });
  return html + `</div>`;
}

function formatRangeLabel(){
  if(state.view==='month') return MONTHS_NOM[state.anchor.getMonth()] + ' ' + state.anchor.getFullYear();
  const s = startOfWeek(state.anchor), e = addDays(s,6);
  if(s.getMonth()===e.getMonth()) return `${s.getDate()}–${e.getDate()} ${MONTHS_GEN[s.getMonth()]}`;
  return `${s.getDate()} ${MONTHS_GEN[s.getMonth()]} – ${e.getDate()} ${MONTHS_GEN[e.getMonth()]}`;
}
function fullDayLabel(d){ return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} — ${WEEKDAYS_FULL[(d.getDay()+6)%7]}`; }
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function applyTemplatesToWeek(weekStart){
  const weekEnd = addDays(weekStart, 6);
  const newEvents = [];
  state.templates.forEach(tpl => {
    const days = tpl.days.split(',').map(Number);
    days.forEach(day => {
      let d = new Date(weekStart);
      const currentDay = (d.getDay()+6)%7;
      let diff = day - currentDay;
      if(diff < 0) diff += 7;
      d = addDays(d, diff);
      if(d <= weekEnd && d >= weekStart){
        const key = toKey(d);
        const exists = state.events.some(e => 
          e.date === key && 
          e.title === tpl.title && 
          e.start === tpl.start &&
          e.is_template === true
        );
        if(!exists){
          newEvents.push({
            date: key,
            start: tpl.start,
            end: tpl.end,
            title: tpl.title,
            category: tpl.category,
            done: false,
            is_template: true,
            _tempId: Date.now() + '_' + Math.random()
          });
        }
      }
    });
  });
  return newEvents;
}

async function applyAllTemplates(){
  if(!state.online) return;
  const today = new Date();
  const weekStart = startOfWeek(today);
  const newEvents = applyTemplatesToWeek(weekStart);
  for(const ev of newEvents){
    const created = await insertEvent(ev);
    if(created){
      state.events.push({ 
        id: created.id, 
        date: created.date, 
        start: created.start_time, 
        end: created.end_time, 
        title: created.title, 
        category: created.category, 
        done: false,
        is_template: true
      });
    }
  }
}

function render(){
  const app = document.getElementById('app');
  const today = new Date();

  // Данные для дня
  const selKey = toKey(state.selected);
  const dayEvs = sortByStart(eventsOn(selKey));

  // Блок расписания на день
  const scheduleHTML = `
    <div class="day-schedule">
      <div class="day-schedule-header">
        <h3>📋 Расписание на день</h3>
        <span class="date">${fullDayLabel(state.selected)}</span>
      </div>
      <div class="schedule-grid">
        ${dayEvs.length ? dayEvs.map(e => `
          <div class="time">${timeLabel(e)}</div>
          <div class="task ${e.done?'done':''}">
            <span class="dot" style="background:${CATEGORIES[e.category].hex}"></span>
            ${escapeHTML(e.title)}
            ${e.is_template ? '<span style="font-size:9px;color:var(--muted);margin-left:4px;">🔄</span>' : ''}
          </div>
        `).join('') : `
          <div class="time">—</div>
          <div class="schedule-empty">Нет дел на этот день</div>
        `}
      </div>
    </div>
  `;

  // Блок задач на день (бывший panel)
  const tasksHTML = dayEvs.length ? dayEvs.map(e=>{
    const isTemplate = e.is_template;
    return `<div class="task-row" data-row="${e.id}">
      <input type="checkbox" ${e.done?'checked':''} data-toggle="${e.id}">
      <span class="task-cat" style="background:${CATEGORIES[e.category].hex}"></span>
      <span class="task-title ${e.done?'done':''}">${isTemplate?'🔄 ':''}${escapeHTML(e.title)}${isTemplate?' <span class="template-badge">шаблон</span>':''}</span>
      <span class="task-time">${timeLabel(e)}</span>
      <span class="task-cat-label">${CATEGORIES[e.category].emoji}</span>
      <button class="del-btn" data-del="${e.id}" aria-label="Удалить">×</button>
    </div>`;
  }).join('') : `<div class="empty-day">Нет задач на этот день</div>`;

  const taskPanelHTML = `
    <div class="task-panel">
      <h2>📌 Задачи на день</h2>
      ${tasksHTML}
      <form class="add-form" id="add-form">
        <input type="text" id="new-title" placeholder="Новая задача" required maxlength="120">
        <select id="new-cat">
          ${CAT_ORDER.map(k=>`<option value="${k}">${CATEGORIES[k].emoji} ${CATEGORIES[k].label}</option>`).join('')}
        </select>
        <div class="time-field"><label for="new-start">с</label><input type="time" id="new-start" required></div>
        <div class="time-field"><label for="new-end">по</label><input type="time" id="new-end"></div>
        <button type="submit" ${state.online?'':'disabled'}>Добавить</button>
        <div class="hint">Конец необязателен</div>
      </form>
      
      <div class="templates-section">
        <h3>🔄 Регулярные задачи</h3>
        ${state.templates.length ? state.templates.map(tpl => {
          const dayNames = tpl.days.split(',').map(d => WEEKDAYS[Number(d)]).join(', ');
          return `<div class="template-item">
            <span>🔄 ${escapeHTML(tpl.title)}</span>
            <span class="days">${dayNames} ${tpl.start}${tpl.end?'–'+tpl.end:''}</span>
            <span>${CATEGORIES[tpl.category].emoji}</span>
            <button class="del-tpl" data-tpl-del="${tpl.id}">×</button>
          </div>`;
        }).join('') : '<div style="color:var(--muted);font-size:12px;padding:4px 0;">Нет регулярных задач</div>'}
        <button class="add-template-btn" id="add-template-btn">+ Добавить регулярную задачу</button>
      </div>
    </div>
  `;

  // Баланс
  let rangeStart, rangeEnd, balanceTitle;
  if(state.view==='month'){
    rangeStart = startOfMonth(state.anchor);
    rangeEnd = new Date(state.anchor.getFullYear(), state.anchor.getMonth()+1, 0);
    balanceTitle = 'Баланс месяца';
  }else{
    rangeStart = startOfWeek(state.anchor);
    rangeEnd = addDays(rangeStart,6);
    balanceTitle = 'Баланс недели';
  }
  const rangeEvents = eventsInRange(rangeStart,rangeEnd);
  const {counts,total} = ribbonSegments(rangeEvents);

  let legendHTML = '';
  if(total>0){
    legendHTML = `<div class="legend">` + CAT_ORDER.map(k=>{
      if(counts[k]===0) return '';
      const pct = Math.round(counts[k]/total*100);
      return `<div class="item"><span class="dot" style="background:${CATEGORIES[k].hex}"></span>${CATEGORIES[k].emoji} ${CATEGORIES[k].label} <span class="pct">${pct}%</span></div>`;
    }).join('') + `</div>`;
  }

  const balanceHTML = `
    <div class="balance-card">
      <div class="btitle">${balanceTitle}</div>
      ${renderRibbonHTML(counts,total,8)}
      ${total>0 ? legendHTML : `<div class="empty-note">Нет запланированных дел на этот период</div>`}
    </div>`;

  // Календарь
  let calendarHTML = '';
  if(state.view==='month'){
    const first = startOfMonth(state.anchor);
    const gridStart = startOfWeek(first);
    const cells = [...Array(42)].map((_,i)=>addDays(gridStart,i));
    const weekdayRow = `<div class="weekday-row">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>`;
    const cellsHTML = cells.map(d=>{
      const key = toKey(d);
      const evs = eventsOn(key);
      const {counts:c,total:t} = ribbonSegments(evs);
      const isOther = d.getMonth()!==state.anchor.getMonth();
      const isToday = sameDay(d,today);
      const isSel = sameDay(d,state.selected);
      return `<button class="daycell ${isOther?'other':''} ${isToday?'today':''} ${isSel?'selected':''}" data-date="${key}">
        <span class="daynum">${d.getDate()}</span>
        ${t>0?`<span class="count">${t}</span>`:''}
        ${renderRibbonHTML(c,t,4)}
      </button>`;
    }).join('');
    calendarHTML = weekdayRow + `<div class="month-grid">${cellsHTML}</div>`;
  }else{
    const s = startOfWeek(state.anchor);
    const days = [...Array(7)].map((_,i)=>addDays(s,i));
    calendarHTML = `<div class="week-grid">` + days.map(d=>{
      const key = toKey(d);
      const evs = sortByStart(eventsOn(key));
      const isToday = sameDay(d,today);
      const isSel = sameDay(d,state.selected);
      const {counts:c,total:t} = ribbonSegments(evs);
      const shown = evs.slice(0,4);
      const chips = shown.map(e => {
        const isTemplate = e.is_template;
        return `<div class="chip ${e.done?'done':''} ${isTemplate?'chip-template':''}">
          ${isTemplate?'<span class="chip-template-icon">🔄</span>':''}
          <span class="sq" style="background:${CATEGORIES[e.category].hex}"></span>
          ${timeLabel(e)} · ${escapeHTML(e.title)}
        </div>`;
      }).join('');
      const more = evs.length>4 ? `<div class="chip-more">+${evs.length-4}</div>` : '';
      return `<button class="week-col ${isToday?'today':''} ${isSel?'selected':''}" data-date="${key}">
        <div><div class="wd-name">${WEEKDAYS[(d.getDay()+6)%7]}</div><div class="wd-num">${d.getDate()}</div></div>
        ${renderRibbonHTML(c,t,4)}
        <div class="chip-list">${chips}${more}</div>
      </button>`;
    }).join('') + `</div>`;
  }

  const setupBanner = state.online ? '' : `
    <div class="setup-banner">
      ⚠️ Сервер не подключён. Впиши <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> в начале файла.
    </div>`;

  const statusDot = state.online ? 'online' : 'offline';

  app.innerHTML = `
    <div class="topbar">
      <div class="flex-between">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="18" stroke="#6C5CE7" stroke-width="2.5"/>
              <path d="M20 6 L20 34 M6 20 L34 20" stroke="#6C5CE7" stroke-width="2" opacity="0.3"/>
              <circle cx="20" cy="20" r="4" fill="#6C5CE7"/>
              <path d="M20 12 C26 12 28 20 20 28 C12 20 14 12 20 12Z" fill="#6C5CE7" opacity="0.15"/>
            </svg>
          </div>
          <div class="logo-text">
            <div class="logo-name">Pulse <span>1</span>one</div>
            <div class="logo-sub">управление временем</div>
          </div>
        </div>
        <div class="flex" style="gap:8px;">
          <span class="status ${statusDot}" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:${state.online?'#00B894':'#E17055'};"></span>
          <div class="viewtoggle">
            <button data-view="week" class="${state.view==='week'?'active':''}">Неделя</button>
            <button data-view="month" class="${state.view==='month'?'active':''}">Месяц</button>
          </div>
        </div>
      </div>
    </div>
    ${setupBanner}
    <div class="code-bar">
      <span class="lbl">Код доступа</span>
      <span class="code-pill">${state.code}</span>
      <button id="copy-code">Копировать</button>
      <span class="spacer"></span>
      <button id="switch-code">Сменить код</button>
    </div>
    <div class="nav">
      <button data-nav="-1">‹</button>
      <div class="label">${formatRangeLabel()}</div>
      <button data-nav="1">›</button>
      <button class="today" data-nav="today">Сегодня</button>
    </div>
    ${scheduleHTML}
    ${taskPanelHTML}
    ${balanceHTML}
    ${calendarHTML}
  `;

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-view]').forEach(btn=>{
    btn.onclick = ()=>{ state.view = btn.dataset.view; render(); };
  });
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = ()=>{
      const n = btn.dataset.nav;
      if(n==='today'){ state.anchor = new Date(); state.selected = new Date(); }
      else{
        const delta = parseInt(n,10);
        if(state.view==='month') state.anchor = new Date(state.anchor.getFullYear(), state.anchor.getMonth()+delta, 1);
        else state.anchor = addDays(state.anchor, delta*7);
      }
      render();
    };
  });
  document.querySelectorAll('[data-date]').forEach(el=>{
    el.onclick = ()=>{ state.selected = parseKey(el.dataset.date); render(); };
  });
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onchange = async ()=>{
      const ev = state.events.find(e=>e.id===el.dataset.toggle);
      if(!ev) return;
      ev.done = !ev.done;
      await patchEvent(ev.id, {done: ev.done});
      setTimeout(render, 300);
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.del;
      state.events = state.events.filter(e=>e.id!==id);
      render();
      await deleteEventRemote(id);
    };
  });
  document.querySelectorAll('[data-tpl-del]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.dataset.tplDel;
      state.templates = state.templates.filter(t=>t.id!==id);
      render();
      await deleteTemplateRemote(id);
    };
  });
  
  const form = document.getElementById('add-form');
  if(form){
    form.onsubmit = async (ev)=>{
      ev.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const start = document.getElementById('new-start').value;
      let end = document.getElementById('new-end').value;
      if(!title || !start) return;
      if(end && end <= start) end = '';
      const cat = document.getElementById('new-cat').value;
      const payload = { date: toKey(state.selected), start, end: end||null, title, category: cat, is_template: false };
      const created = await insertEvent(payload);
      if(created){
        state.events.push({ id:created.id, date:created.date, start:created.start_time, end:created.end_time, title:created.title, category:created.category, done:false, is_template:false });
        render();
      }
    };
  }
  
  const copyBtn = document.getElementById('copy-code');
  if(copyBtn){
    copyBtn.onclick = async ()=>{
      try{ await navigator.clipboard.writeText(state.code); showToast('Код скопирован'); }
      catch(e){ showToast('Не удалось скопировать', true); }
    };
  }
  const switchBtn = document.getElementById('switch-code');
  if(switchBtn){
    switchBtn.onclick = ()=>{
      document.getElementById('code-overlay').hidden = false;
      document.getElementById('code-input').value = '';
      document.getElementById('code-input').focus();
    };
  }
  
  const addTemplateBtn = document.getElementById('add-template-btn');
  if(addTemplateBtn){
    addTemplateBtn.onclick = ()=>{
      document.getElementById('template-overlay').hidden = false;
      document.getElementById('tpl-title').value = '';
      document.getElementById('tpl-start').value = '20:00';
      document.getElementById('tpl-end').value = '';
      document.querySelectorAll('#tpl-days input').forEach(cb => cb.checked = false);
      document.getElementById('tpl-title').focus();
    };
  }
}

const overlay = document.getElementById('code-overlay');
document.getElementById('code-cancel').onclick = ()=>{ overlay.hidden = true; };
document.getElementById('code-go').onclick = async ()=>{
  const val = document.getElementById('code-input').value.trim().toUpperCase();
  if(!val) return;
  overlay.hidden = true;
  setUserCode(val);
  state.code = val;
  document.getElementById('app').innerHTML = '<div class="loading">Загрузка…</div>';
  state.events = await fetchEvents();
  state.templates = await fetchTemplates();
  render();
};

const tplOverlay = document.getElementById('template-overlay');
document.getElementById('tpl-cancel').onclick = ()=>{ tplOverlay.hidden = true; };
document.getElementById('tpl-save').onclick = async ()=>{
  const title = document.getElementById('tpl-title').value.trim();
  const start = document.getElementById('tpl-start').value;
  const end = document.getElementById('tpl-end').value;
  const cat = document.getElementById('tpl-cat').value;
  const checkboxes = document.querySelectorAll('#tpl-days input:checked');
  if(!title || !start || checkboxes.length === 0){
    showToast('Заполни все поля и выбери дни', true);
    return;
  }
  const days = Array.from(checkboxes).map(cb => cb.value).join(',');
  tplOverlay.hidden = true;
  
  const payload = { title, start, end: end||null, category: cat, days };
  const created = await insertTemplate(payload);
  if(created){
    state.templates.push({ id:created.id, title, start, end: end||null, category: cat, days });
    await applyAllTemplates();
    render();
  }
};

document.querySelectorAll('#tpl-days label').forEach(label => {
  const cb = label.querySelector('input');
  cb.onchange = ()=>{
    label.classList.toggle('active', cb.checked);
  };
});

(async function init(){
  if(!state.online){
    render();
    return;
  }
  state.events = await fetchEvents();
  state.templates = await fetchTemplates();
  await applyAllTemplates();
  render();
})();
</script>
</body>
</html>
